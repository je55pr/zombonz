<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombonz</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0d0e0d; }
    #game, #menu { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #game { z-index: 0; }
    #menu { z-index: 1; }
    [hidden] { display: none !important; }
    .pause-menu { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
      background: rgba(3, 4, 4, .79); color: #e5ddc8; font-family: 'Oswald', sans-serif; }
    .pause-panel { width: min(440px, calc(100vw - 36px)); max-height: calc(100vh - 24px); overflow-y: auto;
      box-sizing: border-box; padding: 38px 40px 26px;
      background: linear-gradient(150deg, #22211e, #111312); border: 1px solid #6a433b;
      box-shadow: 0 24px 80px #000c, inset 0 1px #ffffff1c; text-align: center; }
    .pause-panel h1 { margin: 0; font: 68px 'Special Elite', Georgia, serif; letter-spacing: 2px; }
    .pause-rule { height: 2px; margin: 15px auto 28px; width: 75%;
      background: linear-gradient(90deg, transparent, #ad3025, transparent); }
    .pause-main, .pause-settings { display: grid; gap: 10px; }
    .pause-menu button { width: 100%; padding: 12px; border: 1px solid #5b5b50; background: #242723;
      color: #e5ddc8; font: 22px 'Oswald', sans-serif; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
    .pause-menu button:hover, .pause-menu button:focus-visible { border-color: #c64130; background: #44302b;
      outline: none; }
    .pause-setting { display: grid; grid-template-columns: 1fr auto; gap: 8px; text-align: left;
      font: 18px 'Oswald', sans-serif; }
    .pause-setting input { grid-column: 1 / -1; width: 100%; accent-color: #bf382b; }
    .pause-setting output { color: #dbb75d; }
    .pause-panel p { margin: 25px 0 0; color: #aaa391; font: 14px 'Oswald', sans-serif; letter-spacing: 2px; }
    .pause-panel .pause-note { margin: -12px 0 18px; letter-spacing: 1px; }
    .binding-editor { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
      background: rgba(3, 4, 4, .88); color: #e5ddc8; font-family: 'Oswald', sans-serif; }
    .binding-panel { box-sizing: border-box; width: min(560px, calc(100vw - 24px)); max-height: min(760px, calc(100vh - 24px));
      display: flex; flex-direction: column; padding: 24px; background: linear-gradient(150deg, #22211e, #111312);
      border: 1px solid #6a433b; box-shadow: 0 24px 80px #000c; }
    .binding-panel h1 { margin: 0; text-align: center; font: 48px 'Special Elite', Georgia, serif; }
    .binding-panel p { margin: 8px 0 16px; color: #aaa391; text-align: center; font-size: 15px; }
    .binding-rows { overflow-y: auto; min-height: 0; }
    .binding-row { display: grid; grid-template-columns: 1fr 156px; gap: 12px; align-items: center;
      padding: 5px 2px; border-bottom: 1px solid #ffffff1a; font-size: 18px; }
    .binding-editor button { padding: 7px 10px; border: 1px solid #5b5b50; background: #242723;
      color: #e5ddc8; font: 17px 'Oswald', sans-serif; cursor: pointer; }
    .binding-editor button:hover, .binding-editor button:focus-visible { border-color: #c64130; background: #44302b; outline: none; }
    .binding-footer { display: flex; gap: 10px; margin-top: 18px; }
    .binding-footer button { flex: 1; }
    .lobby { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; overflow-y: auto;
      background: rgba(3, 4, 4, .82); color: #e5ddc8; font-family: 'Oswald', sans-serif; }
    .lobby-panel { width: min(560px, calc(100vw - 32px)); margin: 16px 0; padding: 30px 34px 22px; box-sizing: border-box;
      background: linear-gradient(150deg, #22211e, #111312); border: 1px solid #6a433b;
      box-shadow: 0 24px 80px #000c, inset 0 1px #ffffff1c; text-align: center; }
    .lobby-panel h1 { margin: 0; font: 54px 'Special Elite', Georgia, serif; letter-spacing: 2px; }
    .lobby-panel h2 { margin: 18px 0 6px; font: 500 18px 'Oswald', sans-serif; letter-spacing: 3px; text-transform: uppercase;
      color: #c9c1aa; }
    .lobby-map { margin: -14px 0 16px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: #dbb75d; }
    .lobby-name { display: grid; gap: 6px; text-align: left; font-size: 16px; letter-spacing: 1px; }
    .lobby input, .lobby textarea { box-sizing: border-box; width: 100%; padding: 9px 10px; border: 1px solid #5b5b50;
      background: #0c0d0c; color: #eee6cf; font: 15px ui-monospace, Consolas, monospace; resize: none; }
    .lobby input { font: 18px 'Oswald', sans-serif; }
    .lobby input:focus, .lobby textarea:focus { outline: none; border-color: #c64130; }
    .lobby-players { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 19px; }
    .lobby-players span { color: #dbb75d; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
    .lobby-step { display: grid; gap: 8px; margin-top: 16px; text-align: left; }
    .lobby-step p { margin: 6px 0 0; font-size: 16px; letter-spacing: .5px; }
    .lobby-code { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .lobby button { padding: 10px 16px; border: 1px solid #5b5b50; background: #242723; color: #e5ddc8;
      font: 18px 'Oswald', sans-serif; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
    .lobby button:hover:not(:disabled), .lobby button:focus-visible { border-color: #c64130; background: #44302b; outline: none; }
    .lobby button:disabled { opacity: .45; cursor: default; }
    .lobby-status { min-height: 1.4em; margin: 14px 0 0; color: #dbb75d; font-size: 16px; }
    .lobby-status.lobby-error { color: #e0604f; }
    .lobby-actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
    .lobby-hint { margin: 16px 0 0; color: #8f897a; font-size: 13px; letter-spacing: .5px; }
    .lobby-log { margin-top: 12px; font-size: 12px; line-height: 1.4; white-space: pre-wrap; }
    .connection-test { z-index: 5; }
    .connection-test h1 { font-size: 44px; }
    .test-verdict { min-height: 2.6em; margin: 14px 0 12px; font-size: 20px; letter-spacing: .5px; color: #c9c1aa; }
    .test-verdict.test-good { color: #8fcf7a; }
    .test-verdict.test-warn { color: #dbb75d; }
    .test-verdict.test-bad { color: #e0604f; }
    .connection-test textarea { font-size: 13px; line-height: 1.4; white-space: pre-wrap; overflow-x: hidden; overflow-y: auto; }
    .notice { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 4; max-width: calc(100vw - 32px);
      padding: 12px 20px; background: #2a1714; border: 1px solid #a2382b; color: #f0e6cf;
      font: 18px 'Oswald', sans-serif; letter-spacing: 1px; box-shadow: 0 10px 40px #000a; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Zombonz game canvas" hidden></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
