name: Deploy to GitHub Pages

# Every push to dev publishes the game at https://je55pr.github.io/zombonz/.
# To roll back, re-run this workflow from the Actions tab on an earlier dev commit
# (or use "Run workflow" with that commit checked out); the build ID on the F2 screen shows what is live.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but never cancels a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build for the /zombonz/ Pages path
        run: npm run build:pages
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          # Optional: a repository variable holding the address of a game server (docs/server-setup.md), so this copy uses rooms too.
          # Unset, this copy has none and players connect with codes.
          VITE_SIGNAL_URL: ${{ vars.VITE_SIGNAL_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
