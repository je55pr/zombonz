name: Deploy game server

# Every push to dev publishes the game and its room server to Cloudflare (docs/server-setup.md), once the typecheck and tests pass.
# It does nothing until you turn it on: set the repository variable DEPLOY_SERVER to true, and add the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. A fork without them skips it.
# To roll back, re-run this workflow from the Actions tab on an earlier dev commit (or run `npx wrangler rollback`); the build ID
# on the F2 screen, and in Multiplayer > Test my connection, shows what is live.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for one in progress rather than cancelling it.
concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_SERVER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A secret can exist and still be empty (pasting into a hidden prompt is easy to get wrong): say so now, before spending minutes on a build.
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret missing::The repository secret $name is empty or not set. Add it under Settings > Secrets and variables > Actions (see docs/server-setup.md)."
              missing=1
            fi
          done
          exit $missing

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the game for the server
        run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_STUN_URLS: ${{ vars.VITE_STUN_URLS }}
          VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Wrangler version this was set up and tried with; change it when you want to.
          wranglerVersion: '4.144.0'
          command: deploy
